<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🎓%3C/text%3E%3C/svg%3E">
<title>Log in — StudyHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
<a class="skip" href="#main">Skip to main content</a>
<header class="nav"><div class="wrap">
  <a class="logo" href="index.html" aria-label="StudyHub home"><i><svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5zM4 5.5v16"/></svg></i>StudyHub</a>
  <div class="nav-r" style="margin-left:auto"><a class="btn btn-s btn-sm" href="index.html">Back to home</a></div>
</div></header>
<main id="main" class="auth">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="lead">Log in to continue learning.</p>
    <p class="note" id="course-note" hidden></p>
    <form id="auth-form" data-form="login" action="/api/auth/login" method="post" novalidate>
      <div class="field"><label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-err" aria-invalid="false">
        <p class="err" id="email-err" role="alert" hidden></p></div>
      <div class="field"><label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="password-err" aria-invalid="false">
        <p class="err" id="password-err" role="alert" hidden></p></div>
      <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <input type="hidden" name="source" value="">
      <input type="hidden" name="next" value="">
      <p class="form-msg" id="form-msg" role="status" aria-live="polite" hidden></p>
      <button class="btn btn-p btn-lg" type="submit">Log In</button>
    </form>
    <p class="alt">New to StudyHub? <a href="signup.html">Create an account</a></p>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
